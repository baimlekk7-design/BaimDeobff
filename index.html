<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BaimDeobf v1 — Lua Deobfuscator Suite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <!-- Header -->
        <header class="app-header">
            <div class="header-left">
                <div class="logo">
                    <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="2" y="2" width="24" height="24" rx="7" fill="url(#logo-grad)"/>
                        <path d="M8 18L12 10L14 14L16 11L20 18" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                        <defs>
                            <linearGradient id="logo-grad" x1="2" y1="2" x2="26" y2="26" gradientUnits="userSpaceOnUse">
                                <stop stop-color="#6366f1"/>
                                <stop offset="1" stop-color="#8b5cf6"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
                <div class="title-group">
                    <h1>BaimDeobf <span class="version-badge">v4</span></h1>
                    <p class="subtitle">Lua Deobfuscator & Bytecode Toolkit</p>
                </div>
            </div>
            <div class="header-actions">
                <button id="githubLink" class="icon-btn" title="GitHub">
                    <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-grid">
            <!-- Input Panel -->
            <section class="panel input-panel">
                <div class="panel-header">
                    <div class="panel-title">
                        <span class="dot dot-red"></span>
                        <span>Source</span>
                    </div>
                    <div class="panel-tools">
                        <button id="clearBtn" class="tool-btn" title="Clear">
                            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 4h12M5.5 4V2.5h5V4M6 7v5M10 7v5M3 4l1 11h8l1-11"/></svg>
                        </button>
                        <button id="sampleBtn" class="tool-btn" title="Load XOR sample">
                            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 8h10M8 3v10"/></svg>
                        </button>
                        <button id="sampleWeAreDevsBtn" class="tool-btn" title="Load WeAreDevs sample">
                            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 5h12M2 11h12"/></svg>
                        </button>
                    </div>
                </div>
                <textarea id="input" class="code-area" placeholder="// Tempel kode Lua atau bytecode di sini..."></textarea>
                <div class="options-bar">
                    <label class="chip"><input type="checkbox" id="removeComments" checked> Hapus Komentar</label>
                    <label class="chip"><input type="checkbox" id="decodeEscapes" checked> Decode Escape</label>
                    <label class="chip"><input type="checkbox" id="decodeBase64"> Base64</label>
                    <label class="chip"><input type="checkbox" id="renameVars"> Rename Vars</label>
                    <label class="chip"><input type="checkbox" id="autoXor" checked> XOR Loop</label>
                    <label class="chip"><input type="checkbox" id="autoWeAreDevs" checked> WeAreDevs</label>
                </div>
                <div class="primary-actions">
                    <button id="deobfBtn" class="btn-primary">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 8l3 3 6-6"/></svg>
                        Deobfuscate
                    </button>
                </div>
            </section>

            <!-- Output Panel -->
            <section class="panel output-panel">
                <div class="panel-header">
                    <div class="panel-title">
                        <span class="dot dot-green"></span>
                        <span>Result</span>
                    </div>
                    <div class="panel-tools">
                        <button id="copyBtn" class="tool-btn" title="Copy to clipboard">
                            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="5" width="8" height="8" rx="1.5"/><path d="M10 5V4a1 1 0 00-1-1H4a1 1 0 00-1 1v5a1 1 0 001 1h1"/></svg>
                        </button>
                    </div>
                </div>
                <textarea id="output" class="code-area" readonly placeholder="// Hasil deobfuscation akan muncul di sini..."></textarea>
                <div id="status" class="status-message"></div>
            </section>
        </main>

        <!-- Terminal Panel -->
        <section class="terminal-section">
            <div class="terminal-bar">
                <span class="terminal-title">Bytecode Tools</span>
                <button id="helpBtn" class="terminal-help-btn">
                    <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6.5"/><path d="M8 11v-2.5"/><circle cx="8" cy="6" r="0.8" fill="currentColor"/></svg>
                    help
                </button>
            </div>
            <div class="terminal-input-row">
                <span class="prompt">❯</span>
                <input type="text" id="terminalInput" placeholder="detect / convert / extract" autocomplete="off"/>
                <button id="runTerminalBtn" class="btn-run">Run</button>
            </div>
            <div class="terminal-output" id="terminalOutput">BaimDeobf terminal siap. Ketik 'help' untuk bantuan.</div>
        </section>

        <footer class="app-footer">
            <span>© 2025 BaimDeobf</span>
            <span class="footer-sep">•</span>
            <span>Built for speed & clarity</span>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
